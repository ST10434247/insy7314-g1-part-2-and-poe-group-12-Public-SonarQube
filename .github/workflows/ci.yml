
name: HustleHub CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests and Security Checks
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      MONGODB_URI: mongodb://127.0.0.1:27017/hustlehub_ci
      JWT_SECRET: ci-test-secret-not-for-production

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Run backend static analysis
        run: npm run lint:backend

      - name: Start backend server
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -days 1 -nodes \
            -subj "/CN=localhost"

          node backend/server.js > backend.log 2>&1 &

          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --cacert certs/cert.pem -s https://localhost:3000/ > /dev/null; then
              echo "Backend is responding."
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to start."
          cat backend.log
          exit 1

      - name: Run Newman API integration tests
        run: npm test

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend.log

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Run frontend static analysis
        run: npm run lint --prefix frontend

      - name: Run frontend tests
        run: CI=true npm test --prefix frontend -- --watchAll=false

      - name: Build frontend
        run: npm run build --prefix frontend
