name: MERN CI/CD Pipeline & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Security Analysis (npm audit & ESLint)
        run: |
          npm audit --audit-level=high
          npx eslint . --max-warnings=0

      - name: Run Backend Unit & Integration Tests
        run: npm test
        env:
          JWT_SECRET: testsecretkey
          MONGO_URI: mongodb://127.0.0.1:27017/testdb

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (ESLint)
        run: npx eslint src/ --max-warnings=0

      - name: Run Frontend Tests (Jest / RTL)
        run: npm test -- --watchAll=false

      - name: Build React Application
        run: npm run build