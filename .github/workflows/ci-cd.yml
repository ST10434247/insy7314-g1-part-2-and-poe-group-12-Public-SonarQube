name: Part 1 Security Checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-checks:
    name: Backend Security and Code Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      # Retrieves the repository contents so the backend can be checked.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Uses the Node.js version required to install and run the backend.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      # Installs the exact dependency versions recorded in package-lock.json.
      - name: Install Dependencies
        run: npm ci

      # Checks installed dependencies for known high-severity security vulnerabilities.
      - name: Security Audit
        run: npm audit --audit-level=high

      # Performs static analysis on the backend source code.
      - name: ESLint Analysis
        run: npx eslint . --max-warnings=0

      # Verifies that the backend can be loaded and the server source contains
      # no syntax errors without requiring the HTTPS server to remain running.
      - name: Validate Server Syntax
        run: node --check server.js